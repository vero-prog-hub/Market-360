<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architectural 360 VR Viewer | WebXR Meta Quest</title>

  <!-- A-Frame VR Framework (v1.4.2) -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  
  <style>
    /* CSS RESET & FONTS */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1117;
      color: #e0e6ed;
    }

    /* 2D WEB PORTAL LAYOUT */
    #portal-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      z-index: 10;
      background: linear-gradient(135deg, #0a0e14 0%, #161b22 100%);
      transition: opacity 0.5s ease;
    }

    /* HEADER */
    header {
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(12px);
    }

    .brand-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      font-size: 0.75rem;
      background: #10b981;
      color: #0d1117;
      padding: 3px 8px;
      border-radius: 12px;
      text-transform: uppercase;
      font-weight: 700;
    }

    /* MAIN CONTENT GALLERY */
    main {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .section-title {
      font-size: 1.1rem;
      color: #a7f3d0;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      margin-bottom: 40px;
    }

    .scene-card {
      background: #16202c;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .scene-card:hover {
      transform: translateY(-5px);
      border-color: #10b981;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.3);
    }

    .scene-card.active {
      border-color: #10b981;
      box-shadow: 0 0 0 2px #10b981;
    }

    .thumb-wrapper {
      width: 100%;
      height: 180px;
      overflow: hidden;
      position: relative;
    }

    .thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .scene-card:hover .thumb-img {
      transform: scale(1.05);
    }

    .card-info {
      padding: 15px;
    }

    .scene-name {
      font-size: 1rem;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 5px;
    }

    .scene-desc {
      font-size: 0.85rem;
      color: #64748b;
    }

    /* CUSTOM UPLOAD CONTROLS */
    .upload-section {
      background: rgba(22, 32, 44, 0.5);
      border: 2px dashed rgba(16, 185, 129, 0.3);
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      margin-bottom: 40px;
      transition: border-color 0.3s;
    }

    .upload-section:hover {
      border-color: #10b981;
    }

    .upload-btn {
      display: inline-block;
      padding: 10px 20px;
      background: #10b981;
      color: #0d1117;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .upload-btn:hover {
      background: #059669;
      color: #fff;
    }

    input[type="file"] {
      display: none;
    }

    /* BOTTOM CONTROLS / ENTER VR BUTTON */
    footer {
      padding: 20px 30px;
      background: rgba(10, 14, 20, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .enter-vr-btn {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
      transition: all 0.2s;
    }

    .enter-vr-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
    }

    /* HIDE CANVAS WHEN VR NOT ACTIVE */
    a-scene {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- 2D WEB PORTAL (DESKTOP / MOBILE / QUEST BROWSER 2D TAB) -->
  <div id="portal-container">
    <header>
      <div class="brand-title">
        ARCH-VIS 360 <span class="brand-badge">Enscape WebXR</span>
      </div>
      <div style="font-size: 0.9rem; color: #94a3b8;">
        Target Device: <strong>Meta Quest 2 / 3 / Pro</strong>
      </div>
    </header>

    <main>
      <div class="section-title">Enscape Landscape Gallery</div>
      
      <div class="gallery-grid" id="galleryGrid">
        <!-- Scene cards dynamically injected by JavaScript -->
      </div>

      <div class="upload-section">
        <h3 style="margin-bottom: 8px;">Upload Custom Enscape Panoramas</h3>
        <p style="font-size: 0.85rem; color: #94a3b8;">Load your local 360 equirectangular JPG/PNG files directly into the VR viewport.</p>
        <label class="upload-btn">
          Select 360 Renders
          <input type="file" id="imageUploader" accept="image/jpeg, image/png" multiple>
        </label>
      </div>
    </main>

    <footer>
      <div id="activeSceneLabel" style="font-size: 0.95rem; color: #cbd5e1;">
        Selected: <strong>Garden Landscape View</strong>
      </div>
      <button class="enter-vr-btn" onclick="launchVRMode()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M2 8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-3l-2-2H9l-2 2H4a2 2 0 0 1-2-2V8z"></path>
          <circle cx="7" cy="12" r="2"></circle>
          <circle cx="17" cy="12" r="2"></circle>
        </svg>
        ENTER VR HEADSET
      </button>
    </footer>
  </div>

  <!-- A-FRAME 3D WEBXR SCENE -->
  <a-scene embedded webxr="optionalFeatures: hit-test, local-floor;">
    <!-- Asset Management -->
    <a-assets id="assetManager">
      <img id="sky-texture" crossorigin="anonymous" src="brooke-balentine-Nfc8i3TwKZk-unsplash.jpg">
    </a-assets>

    <!-- 360 Sky Projection -->
    <a-sky id="vrSky" src="#sky-texture" rotation="0 -90 0" animation__fade="property: material.opacity; dur: 300; easing: linear;"></a-sky>

    <!-- Camera Rigid Body & Spatial Controllers -->
    <a-entity id="rig" position="0 0 0">
      <a-camera id="camera" look-controls="pointerLockEnabled: false" position="0 1.6 0">
        <!-- Fallback Cursor for Desktop / Non-VR preview -->
        <a-cursor id="mouseCursor" color="#10b981" raycaster="objects: .clickable"></a-cursor>
      </a-camera>

      <!-- Meta Quest Touch Controllers with Laser Raycasting -->
      <a-entity id="leftController" oculus-touch-controls="hand: left" laser-controls="hand: left" raycaster="objects: .clickable; far: 10; linecolor: #10b981"></a-entity>
      <a-entity id="rightController" oculus-touch-controls="hand: right" laser-controls="hand: right" raycaster="objects: .clickable; far: 10; linecolor: #3b82f6"></a-entity>
    </a-entity>

    <!-- IN-VR SPATIAL HUD PANEL (Anchored 2.2m in front of camera) -->
    <a-entity id="spatialHUD" position="0 1.4 -2.2" rotation="0 0 0">
      
      <!-- Panel Background Glassmorphism Base -->
      <a-plane width="2.4" height="0.6" color="#0a0e14" material="opacity: 0.88; transparent: true; shader: flat;" radius="0.05">
        <a-ring radius-inner="0" radius-outer="0.01" color="#10b981" position="0 0 0.001"></a-ring>
      </a-plane>

      <!-- Spatial Header Text -->
      <a-text id="hudTitle" value="Garden Landscape View" align="center" position="0 0.18 0.01" scale="0.6 0.6 0.6" color="#ffffff"></a-text>

      <!-- Spatial Navigation Buttons -->
      <a-entity id="btnPrev" class="clickable" position="-0.7 -0.08 0.02" geometry="primitive: plane; width: 0.5; height: 0.2" material="color: #16202c; shader: flat">
        <a-text value="< PREV" align="center" position="0 0 0.01" scale="0.4 0.4 0.4" color="#ffffff"></a-text>
      </a-entity>

      <a-entity id="btnMenu" class="clickable" position="0 -0.08 0.02" geometry="primitive: plane; width: 0.6; height: 0.2" material="color: #16202c; shader: flat">
        <a-text value="EXIT VR" align="center" position="0 0 0.01" scale="0.4 0.4 0.4" color="#ef4444"></a-text>
      </a-entity>

      <a-entity id="btnNext" class="clickable" position="0.7 -0.08 0.02" geometry="primitive: plane; width: 0.5; height: 0.2" material="color: #16202c; shader: flat">
        <a-text value="NEXT >" align="center" position="0 0 0.01" scale="0.4 0.4 0.4" color="#ffffff"></a-text>
      </a-entity>
    </a-entity>

    <!-- 3D INTERACTIVE HOTSPOT INDICATORS IN SPACE -->
    <a-entity id="hotspotContainer">
      <!-- Dynamic Hotspots populated via JS -->
    </a-entity>
  </a-scene>

  <!-- JAVASCRIPT APPLICATION LOGIC -->
  <script>
    // ARCHITECTURAL SCENE DATASET (USING YOUR NEW IMAGE AS PRIMARY SCENE)
    const scenes = [
      {
        id: 'scene-1',
        title: 'Garden Landscape View',
        desc: 'Enscape outdoor landscape and floral garden render.',
        url: 'brooke-balentine-Nfc8i3TwKZk-unsplash.jpg',
        hotspots: [
          { name: 'Botanical Glasshouse', targetId: 'scene-2', pos: '-2.5 1.2 -3.5' }
        ]
      },
      {
        id: 'scene-2',
        title: 'Botanical Glasshouse',
        desc: 'Custom glasshouse interior atmosphere render.',
        url: 'maryam-seyidova-8FCnq-1kMuA-unsplash.jpg',
        hotspots: [
          { name: 'Garden Landscape View', targetId: 'scene-1', pos: '2.5 1.2 3.5' }
        ]
      }
    ];

    let currentSceneIndex = 0;

    // INITIALIZATION
    document.addEventListener('DOMContentLoaded', () => {
      renderGalleryCards();
      setupVRInteractions();
      setupFileUploads();
    });

    // RENDER 2D GALLERY CARDS
    function renderGalleryCards() {
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = '';

      scenes.forEach((scene, index) => {
        const card = document.createElement('div');
        card.className = `scene-card ${index === currentSceneIndex ? 'active' : ''}`;
        card.onclick = () => selectScene(index);

        card.innerHTML = `
          <div class="thumb-wrapper">
            <img class="thumb-img" src="${scene.url}" alt="${scene.title}">
          </div>
          <div class="card-info">
            <div class="scene-name">${scene.title}</div>
            <div class="scene-desc">${scene.desc}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // SELECT SCENE & UPDATE VIEWERS
    function selectScene(index) {
      currentSceneIndex = index;
      const selected = scenes[currentSceneIndex];

      // Update 2D UI
      renderGalleryCards();
      document.getElementById('activeSceneLabel').innerHTML = `Selected: <strong>${selected.title}</strong>`;

      // Update 3D A-Frame VR Scene Sky
      const vrSky = document.getElementById('vrSky');
      vrSky.setAttribute('material', 'opacity', '0');

      setTimeout(() => {
        vrSky.setAttribute('src', selected.url);
        vrSky.setAttribute('material', 'opacity', '1');
      }, 300);

      // Update In-VR HUD Title
      document.getElementById('hudTitle').setAttribute('value', selected.title);

      // Spawn 3D Hotspots
      render3DHotspots(selected.hotspots);
    }

    // SPAWN DYNAMIC 3D HOTSPOTS IN VR WORLD SPACE
    function render3DHotspots(hotspots) {
      const container = document.getElementById('hotspotContainer');
      container.innerHTML = '';

      if (!hotspots) return;

      hotspots.forEach(spot => {
        const hotspotEntity = document.createElement('a-entity');
        hotspotEntity.setAttribute('position', spot.pos);
        hotspotEntity.setAttribute('class', 'clickable');

        // Outer Pulsing Ring + Sphere Icon
        hotspotEntity.innerHTML = `
          <a-sphere radius="0.12" color="#10b981" material="opacity: 0.9; transparent: true">
          </a-sphere>
          <a-ring radius-inner="0.15" radius-outer="0.2" color="#ffffff" rotation="-90 0 0"></a-ring>
          <a-text value="${spot.name}" align="center" position="0 0.3 0" scale="0.4 0.4 0.4" color="#ffffff" geometry="primitive: plane; width: 0.9; height: 0.2" material="color: #0a0e14; opacity: 0.8"></a-text>
        `;

        // Click Handler for VR Controller Raycast Teleport
        hotspotEntity.addEventListener('click', () => {
          const targetIndex = scenes.findIndex(s => s.id === spot.targetId);
          if (targetIndex !== -1) {
            selectScene(targetIndex);
          }
        });

        container.appendChild(hotspotEntity);
      });
    }

    // SETUP VR HUD INTERACTION LISTENERS
    function setupVRInteractions() {
      document.getElementById('btnPrev').addEventListener('click', () => {
        let prev = currentSceneIndex - 1;
        if (prev < 0) prev = scenes.length - 1;
        selectScene(prev);
      });

      document.getElementById('btnNext').addEventListener('click', () => {
        let next = currentSceneIndex + 1;
        if (next >= scenes.length) next = 0;
        selectScene(next);
      });

      document.getElementById('btnMenu').addEventListener('click', () => {
        const sceneEl = document.querySelector('a-scene');
        if (sceneEl.is('vr-mode')) {
          sceneEl.exitVR();
        }
      });
    }

    // LOCAL ENSCAPE IMAGE UPLOADER HANDLER
    function setupFileUploads() {
      const uploader = document.getElementById('imageUploader');
      uploader.addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        
        files.forEach((file, idx) => {
          const reader = new FileReader();
          reader.onload = (event) => {
            const newScene = {
              id: `custom-${Date.now()}-${idx}`,
              title: file.name.replace(/\.[^/.]+$/, ""),
              desc: 'Custom Enscape Uploaded Render',
              url: event.target.result,
              hotspots: []
            };
            scenes.push(newScene);
            selectScene(scenes.length - 1);
          };
          reader.readAsDataURL(file);
        });
      });
    }

    // LAUNCH NATIVE WEBXR VR MODE
    function launchVRMode() {
      const sceneEl = document.querySelector('a-scene');
      
      // Enter WebXR immersive state on Meta Quest
      if (sceneEl.hasLoaded) {
        sceneEl.enterVR();
      } else {
        sceneEl.addEventListener('loaded', () => sceneEl.enterVR());
      }
    }
  </script>
</body>
</html>
