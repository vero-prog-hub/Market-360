<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poorna Market VR Experience</title>

  <!-- A-Frame VR Library -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0e14;
      color: #ffffff;
    }

    /* 2D HUD OVERLAY LAYER */
    #hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 24px;
    }

    .interactive {
      pointer-events: auto;
    }

    /* TOP HEADER BRANDING */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .brand-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      padding: 14px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #ffffff;
    }

    .brand-location {
      font-size: 0.85rem;
      color: #ef4444;
      font-weight: 600;
      margin-top: 2px;
    }

    .brand-subtitle {
      font-style: italic;
      font-size: 0.95rem;
      color: #fca5a5;
      margin-top: 4px;
    }

    .badge-360 {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
    }

    /* BOTTOM CONTROLS & GALLERY */
    .bottom-dock {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      gap: 16px;
    }

    .gallery-container {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 10px 16px;
      display: flex;
      gap: 12px;
      overflow-x: auto;
    }

    .thumb-btn {
      width: 90px;
      height: 60px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .thumb-btn.active {
      border-color: #ef4444;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
    }

    .thumb-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .vr-launch-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 30px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
    }

    a-scene {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- 2D HUD OVERLAY -->
  <div id="hud-overlay">
    <div class="top-header">
      <div class="brand-card interactive">
        <div class="brand-title">POORNA MARKET</div>
        <div class="brand-location">📍 VISAKHAPATNAM</div>
        <div class="brand-subtitle">Where every street has a story...</div>
      </div>
      <div class="badge-360">360°</div>
    </div>

    <div class="bottom-dock">
      <div class="gallery-container interactive" id="gallery">
        <!-- Thumbnail item generated via script below -->
      </div>

      <button class="vr-launch-btn interactive" onclick="launchVR()">
        ENTER VR HEADSET
      </button>
    </div>
  </div>

  <!-- 3D WEBXR VR SCENE -->
  <a-scene embedded webxr="optionalFeatures: hit-test, local-floor;">
    <!-- Asset linking image directly in the root directory -->
    <a-assets>
      <img id="poorna-golden-hour" src="Golden Hour at Poorna Market.png">
    </a-assets>

    <!-- 360 Panorama Projection -->
    <a-sky id="sky" src="#poorna-golden-hour" rotation="0 -90 0"></a-sky>

    <!-- Camera and Controllers -->
    <a-entity id="rig" position="0 0 0">
      <a-camera look-controls="pointerLockEnabled: false" position="0 1.6 0">
        <a-cursor color="#ef4444" raycaster="objects: .clickable"></a-cursor>
      </a-camera>
      
      <!-- Meta Quest Controllers with Laser Raycasting -->
      <a-entity oculus-touch-controls="hand: left" laser-controls="hand: left" raycaster="objects: .clickable"></a-entity>
      <a-entity oculus-touch-controls="hand: right" laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>
    </a-entity>

    <!-- IN-VR ANNOTATION HOTSPOTS -->
    <a-entity class="clickable" position="-2 1.5 -3" id="hotspot-flower">
      <a-plane width="1.8" height="0.6" color="#0f172a" material="opacity: 0.85">
        <a-text value="Flower Stalls" position="-0.8 0.15 0.01" scale="0.45 0.45 0.45" color="#ffffff"></a-text>
        <a-text value="Fragrant blooms, brightening every corner." position="-0.8 -0.1 0.01" scale="0.25 0.25 0.25" color="#fca5a5"></a-text>
      </a-plane>
    </a-entity>

    <a-entity class="clickable" position="2 1.5 -3" id="hotspot-food">
      <a-plane width="1.8" height="0.6" color="#0f172a" material="opacity: 0.85">
        <a-text value="Food Court" position="-0.8 0.15 0.01" scale="0.45 0.45 0.45" color="#ffffff"></a-text>
        <a-text value="Local flavours, endless choices." position="-0.8 -0.1 0.01" scale="0.25 0.25 0.25" color="#fca5a5"></a-text>
      </a-plane>
    </a-entity>
  </a-scene>

  <script>
    // LIST OF IMAGES PLACED DIRECTLY IN THE ROOT FOLDER
    const scenes = [
      {
        title: 'Golden Hour at Poorna Market',
        fileName: 'Golden Hour at Poorna Market.png'
      }
    ];

    let currentSceneIndex = 0;

    // Render Gallery Thumbnails
    function initGallery() {
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';

      scenes.forEach((scene, index) => {
        const btn = document.createElement('div');
        btn.className = `thumb-btn ${index === currentSceneIndex ? 'active' : ''}`;
        btn.onclick = () => loadScene(index);
        btn.innerHTML = `<img src="${encodeURI(scene.fileName)}" alt="${scene.title}">`;
        gallery.appendChild(btn);
      });
    }

    function loadScene(index) {
      currentSceneIndex = index;
      initGallery();
      const selected = scenes[currentSceneIndex];
      document.getElementById('sky').setAttribute('src', encodeURI(selected.fileName));
    }

    function launchVR() {
      const sceneEl = document.querySelector('a-scene');
      if (sceneEl.hasLoaded) {
        sceneEl.enterVR();
      } else {
        sceneEl.addEventListener('loaded', () => sceneEl.enterVR());
      }
    }

    document.addEventListener('DOMContentLoaded', initGallery);
  </script>
</body>
</html>
