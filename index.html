<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poorna Market - 360° VR Tour</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI Overlay Elements */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 24px; }
        .interactive { pointer-events: auto; }
        
        /* Top Navigation Header */
        .header { display: flex; justify-content: space-between; align-items: flex-start; }
        .title-card h1 { font-size: 26px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .title-card p { font-size: 13px; color: #e0e0e0; font-style: italic; opacity: 0.9; }
        
        .top-controls { display: flex; gap: 12px; }
        .btn { background: rgba(20, 20, 25, 0.75); border: 1px solid rgba(255,255,255,0.25); backdrop-filter: blur(12px); color: #fff; padding: 10px 18px; border-radius: 30px; cursor: pointer; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: all 0.2s ease; }
        .btn:hover { background: rgba(255, 255, 255, 0.25); border-color: rgba(255,255,255,0.6); transform: translateY(-2px); }
        
        /* Interactive Radar Key Map */
        .radar-map { position: absolute; bottom: 24px; left: 24px; width: 160px; height: 160px; background: rgba(15, 15, 20, 0.8); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; backdrop-filter: blur(10px); overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .radar-grid { width: 100%; height: 100%; position: relative; background: radial-gradient(circle, rgba(0,255,180,0.1) 0%, transparent 70%); }
        .radar-pin { position: absolute; width: 12px; height: 12px; background: #ffaa00; border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer; transition: transform 0.2s; }
        .radar-pin.active { background: #00ffaa; box-shadow: 0 0 12px #00ffaa; transform: translate(-50%, -50%) scale(1.3); }
        
        /* Navigation Thumbnail Carousel */
        .carousel-bar { align-self: center; display: flex; gap: 12px; background: rgba(15, 15, 20, 0.75); border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(16px); padding: 8px 16px; border-radius: 40px; margin-bottom: 8px; }
        .thumb { width: 64px; height: 44px; border-radius: 12px; border: 2px solid transparent; opacity: 0.6; cursor: pointer; overflow: hidden; transition: all 0.2s ease; background-size: cover; background-position: center; }
        .thumb.active, .thumb:hover { opacity: 1; border-color: #00ffaa; transform: scale(1.08); }
        
        /* VR Mode Trigger Button */
        .vr-btn { position: absolute; bottom: 24px; right: 24px; background: #00ffaa; color: #000; font-weight: 700; border: none; padding: 14px 24px; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 20px rgba(0,255,170,0.4); }
        .vr-btn:hover { background: #33ffbb; transform: scale(1.05); }

        #file-input { display: none; }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <div class="header">
            <div class="title-card">
                <h1>Poorna Market</h1>
                <p>Visakhapatnam — Architectural Spatial Walkthrough</p>
            </div>
            <div class="top-controls interactive">
                <button class="btn" onclick="document.getElementById('file-input').click()">
                    📁 Load 360 Render
                </button>
                <input type="file" id="file-input" accept="image/*" onchange="loadLocalImage(event)">
            </div>
        </div>

        <div class="radar-map interactive" id="radarMap">
            <div class="radar-grid" id="radarGrid"></div>
        </div>

        <div class="carousel-bar interactive" id="carousel"></div>

        <button class="btn vr-btn interactive" onclick="toggleVR()">🥽 Enter Meta Quest VR</button>
    </div>

    <script>
        const scenes = [
            { id: 0, name: "Market Street", file: "Golden Hour at Poorna Market (1).png", x: 50, y: 50 },
            { id: 1, name: "Archway Gate", file: "image_fd8bff.jpg", x: 30, y: 30 },
            { id: 2, name: "Bazaar Walk", file: "image_fd8c20.jpg", x: 70, y: 40 },
            { id: 3, name: "Flower Stalls", file: "image_fd8c97.jpg", x: 45, y: 75 }
        ];

        let activeSceneIndex = 0;
        let scene, camera, renderer, skySphere, material;
        let isDragging = false, previousMousePosition = { x: 0, y: 0 };
        let lon = 0, lat = 0, phi = 0, theta = 0;

        function init() {
            const container = document.getElementById('canvas-container');
            
            // WebGL Scene Setup
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1100);
            camera.target = new THREE.Vector3(0, 0, 0);

            // Inverted Sphere Geometry for 360 Panorama Mapping
            const geometry = new THREE.SphereGeometry(500, 60, 40);
            geometry.scale(-1, 1, 1);

            material = new THREE.MeshBasicMaterial();
            skySphere = new THREE.Mesh(geometry, material);
            scene.add(skySphere);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // Orbit Mouse & Touch Handlers
            container.addEventListener('mousedown', onPointerStart);
            container.addEventListener('mousemove', onPointerMove);
            container.addEventListener('mouseup', onPointerEnd);
            container.addEventListener('touchstart', onPointerStart);
            container.addEventListener('touchmove', onPointerMove);
            container.addEventListener('touchend', onPointerEnd);
            window.addEventListener('resize', onWindowResize);

            buildUI();
            loadScene(0);
            animate();
        }

        function loadScene(index) {
            activeSceneIndex = index;
            const targetFile = scenes[index].file;
            const loader = new THREE.TextureLoader();

            loader.load(
                targetFile,
                function(texture) {
                    material.map = texture;
                    material.needsUpdate = true;
                },
                undefined,
                function() {
                    // Visual Fallback Texture if file is unreadable due to CORS or local path restrictions
                    const canvas = document.createElement('canvas');
                    canvas.width = 2048; canvas.height = 1024;
                    const ctx = canvas.getContext('2d');
                    const grad = ctx.createLinearGradient(0,0,0,1024);
                    grad.addColorStop(0, '#ff7e5f'); grad.addColorStop(1, '#feb47b');
                    ctx.fillStyle = grad; ctx.fillRect(0,0,2048,1024);
                    ctx.fillStyle = '#ffffff'; ctx.font = '48px Segoe UI';
                    ctx.fillText("Poorna Market — " + scenes[index].name, 800, 512);

                    const fallbackTexture = new THREE.CanvasTexture(canvas);
                    material.map = fallbackTexture;
                    material.needsUpdate = true;
                }
            );

            updateRadarUI();
        }

        function loadLocalImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const texture = new THREE.Texture(img);
                        texture.needsUpdate = true;
                        material.map = texture;
                        material.needsUpdate = true;
                    };
                };
                reader.readAsDataURL(file);
            }
        }

        function buildUI() {
            const carousel = document.getElementById('carousel');
            const radarGrid = document.getElementById('radarGrid');
            carousel.innerHTML = '';
            radarGrid.innerHTML = '';

            scenes.forEach((sc, i) => {
                // Carousel items
                const thumb = document.createElement('div');
                thumb.className = `thumb ${i === 0 ? 'active' : ''}`;
                thumb.style.backgroundColor = '#333';
                thumb.onclick = () => {
                    document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
                    thumb.classList.add('active');
                    loadScene(i);
                };
                carousel.appendChild(thumb);

                // Radar Map Pins
                const pin = document.createElement('div');
                pin.className = `radar-pin ${i === 0 ? 'active' : ''}`;
                pin.style.left = `${sc.x}%`;
                pin.style.top = `${sc.y}%`;
                pin.id = `pin-${i}`;
                pin.onclick = () => loadScene(i);
                radarGrid.appendChild(pin);
            });
        }

        function updateRadarUI() {
            document.querySelectorAll('.radar-pin').forEach((p, i) => {
                p.classList.toggle('active', i === activeSceneIndex);
            });
        }

        function onPointerStart(e) {
            isDragging = true;
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            previousMousePosition = { x: clientX, y: clientY };
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            
            lon -= (clientX - previousMousePosition.x) * 0.25;
            lat += (clientY - previousMousePosition.y) * 0.25;
            lat = Math.max(-85, Math.min(85, lat));

            previousMousePosition = { x: clientX, y: clientY };
        }

        function onPointerEnd() { isDragging = false; }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            lat = Math.max(-85, Math.min(85, lat));
            phi = THREE.MathUtils.degToRad(90 - lat);
            theta = THREE.MathUtils.degToRad(lon);

            camera.target.x = 500 * Math.sin(phi) * Math.cos(theta);
            camera.target.y = 500 * Math.cos(phi);
            camera.target.z = 500 * Math.sin(phi) * Math.sin(theta);

            camera.lookAt(camera.target);
            renderer.render(scene, camera);
        }

        function toggleVR() {
            alert("WebXR Mode: Open this page URL inside Meta Quest Browser to trigger native 6DoF spatial VR playback.");
        }

        window.onload = init;
    </script>
</body>
</html>
