<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poorna Market Visakhapatnam - 360° VR Walkthrough</title>
  
  <!-- Three.js Engine for High-Performance WebGL & WebXR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050b14;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #f8fafc;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Landing Entrance Modal */
    #landing-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      z-index: 999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .modal-card {
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(16px);
      padding: 36px;
      border-radius: 24px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }

    .modal-card h1 {
      margin: 0 0 6px 0;
      font-size: 26px;
      letter-spacing: 1.5px;
      color: #38bdf8;
    }

    .modal-card h2 {
      margin: 0 0 16px 0;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .modal-card p {
      font-size: 14px;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 24px;
    }

    .enter-btn {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #000;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 32px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
      transition: all 0.2s ease;
    }

    .enter-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6);
    }

    /* 2D Overlay Interface */
    #hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .hud-panel {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .panel-header span {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #38bdf8;
      text-transform: uppercase;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 14px;
      cursor: pointer;
      padding: 0 4px;
    }

    .ctrl-btn:hover { color: #fff; }

    /* Top Utility Controls */
    #top-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .audio-btn {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid #f59e0b;
      color: #f59e0b;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .audio-btn:hover {
      background: #f59e0b;
      color: #000;
    }

    /* Radar Map Panel (Bottom-Left) */
    #radar-panel {
      position: absolute;
      bottom: 90px;
      left: 20px;
      width: 160px;
    }

    .radar-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.4);
      background: radial-gradient(circle, rgba(15, 23, 42, 0.6) 0%, rgba(2, 6, 23, 0.9) 100%);
      margin: 8px auto 0 auto;
      position: relative;
    }

    .radar-pin {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #f59e0b;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      border: 2px solid #fff;
      transition: all 0.2s ease;
    }

    .radar-pin.active {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      transform: translate(-50%, -50%) scale(1.3);
    }

    /* Description Card Panel (Bottom-Right) */
    #info-panel {
      position: absolute;
      bottom: 90px;
      right: 20px;
      max-width: 300px;
    }

    #info-desc {
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.5;
      margin: 0;
    }

    /* Scene Navigation Tabs Bar */
    #tabs-bar {
      pointer-events: auto;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      align-self: center;
      max-width: 90%;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
