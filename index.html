<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poorna Market Visakhapatnam - 360° VR Architectural Walkthrough</title>
  
  <!-- Three.js Engine for WebGL & WebXR Session Handling -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #031410;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #f8fafc;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Glassmorphic Landing Entrance Screen Modal */
    #landing-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #063d2e 0%, #021a14 100%);
      z-index: 999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .modal-card {
      background: rgba(6, 44, 34, 0.92);
      border: 1px solid rgba(245, 158, 11, 0.3);
      backdrop-filter: blur(20px);
      padding: 36px;
      border-radius: 24px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
    }

    .modal-card h1 {
      margin: 0 0 6px 0;
      font-size: 26px;
      letter-spacing: 1.5px;
      color: #f59e0b;
    }

    .modal-card h2 {
      margin: 0 0 16px 0;
      font-size: 13px;
      font-weight: 500;
      color: #34d399;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .modal-card p {
      font-size: 14px;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 24px;
    }

    .enter-btn {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #000;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 32px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
      transition: all 0.2s ease;
    }

    .enter-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6);
    }

    /* 2D HUD Overlay Interface */
    #hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .hud-panel {
      pointer-events: auto;
      background: rgba(4, 30, 24, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .panel-header span {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #f59e0b;
      text-transform: uppercase;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 14px;
      cursor: pointer;
      padding: 0 4px;
    }

    .ctrl-btn:hover { color: #fff; }

    /* Top Bar Controls */
    #top-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .audio-btn {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid #f59e0b;
      color: #f59e0b;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .audio-btn:hover {
      background: #f59e0b;
      color: #000;
    }
